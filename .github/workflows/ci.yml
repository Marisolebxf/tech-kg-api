name: Code Quality and Unit Tests

# CICD 测试分支：验证通过后把 test/cicd 换成 kgetl（保留 main）
on:
  push:
    branches: ["test/cicd"]
  pull_request:
    branches: ["test/cicd"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      GRAPH_DB_BACKEND: trsgraph
      TRSGRAPH_HOST: 127.0.0.1
      TRSGRAPH_PORT: 9669
      TRSGRAPH_USERNAME: root
      TRSGRAPH_PASSWORD: trsadmin
      TRSGRAPH_SPACE: techkg
      LLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      ZHIPUAI_API_KEY: ${{ secrets.GLM_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Run unit and non-external integration tests
        run: AUTH_ENABLED=false PYTHONPATH=. uv run pytest tests -m "not external" -v

  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test
