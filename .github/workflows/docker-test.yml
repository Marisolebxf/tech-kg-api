name: Container Deployment and Integration Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      LLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      ZHIPUAI_API_KEY: ${{ secrets.GLM_API_KEY }}
      # Integration tests provide their own SQLite Schema store; CI has no MySQL service.
      SCHEMA_AUTO_INIT: "false"
      RUN_REAL_LLM_TESTS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for docker compose
        run: |
          cat > backend/.env <<EOF
          GRAPH_DB_BACKEND=trsgraph
          TRSGRAPH_HOST=127.0.0.1
          TRSGRAPH_PORT=9669
          TRSGRAPH_USERNAME=root
          TRSGRAPH_PASSWORD=trsadmin
          TRSGRAPH_SPACE=techkg
          MYSQL_HOST=127.0.0.1
          MYSQL_PORT=3306
          MYSQL_DATABASE=gkx_local
          MYSQL_USERNAME=root
          MYSQL_PASSWORD=123456789
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          LLM_API_KEY=${LLM_API_KEY}
          ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
          LLM_MODEL=glm-5.1
          RUN_REAL_LLM_TESTS=false
          EOF

      - name: Build Docker image
        run: docker compose build

      - name: Create external Docker networks
        run: |
          docker network inspect tech-kg-engine_default >/dev/null 2>&1 || docker network create tech-kg-engine_default
          docker network inspect trs-graph-service_default >/dev/null 2>&1 || docker network create trs-graph-service_default

      - name: Deploy FastAPI
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for FastAPI to start..."
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:8001/health)" \
              && [ "${response}" = '{"status":"ok"}' ]; then
              echo "FastAPI is ready."
              exit 0
            fi

            if ! docker compose ps --status running --services api | grep --quiet '^api$'; then
              echo "FastAPI container stopped before becoming ready."
              docker compose ps --all
              docker compose logs --no-color api operator-rustfs schema-minio
              exit 1
            fi

            echo "FastAPI is not ready yet (attempt ${attempt}/30)."
            sleep 5
          done

          echo "Timed out waiting for FastAPI."
          docker compose ps --all
          docker compose logs --no-color api operator-rustfs schema-minio
          exit 1

      - name: Run integration tests
        run: docker compose exec -T api env PYTHONPATH=. uv run pytest tests/integration -m "not external" -v

      - name: Tear down
        if: always()
        run: docker compose down
