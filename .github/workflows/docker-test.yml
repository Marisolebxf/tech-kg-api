name: Container Deployment and Integration Tests

on:
  push:
    branches: ["main", "kgetl"]
  pull_request:
    branches: ["main", "kgetl"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      ZHIPUAI_API_KEY: ${{ secrets.GLM_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create isolated CI compose configuration
        run: |
          cat > compose.ci.yml <<'EOF'
          services:
            mysql:
              image: mysql:8.0
              environment:
                MYSQL_ROOT_PASSWORD: ci_test_password
                MYSQL_ROOT_HOST: "%"
                MYSQL_DATABASE: gkx_ci
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pci_test_password"]
                interval: 5s
                timeout: 5s
                retries: 30
            redis:
              image: redis:7.4-alpine
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 5s
                retries: 20
            api:
              build:
                context: ./backend
                target: test
                args:
                  PYPI_INDEX_URL: https://pypi.org/simple/
                  PRELOAD_EMBEDDING_MODEL: "false"
              ports:
                - "8001:8000"
              environment:
                APP_ENV: test
                GRAPH_DB_BACKEND: trsgraph
                TRS_GRAPH_BASE_URL: http://127.0.0.1:8090
                TRS_GRAPH_SPACE: techkg
                MYSQL_HOST: mysql
                MYSQL_PORT: "3306"
                MYSQL_DATABASE: gkx_ci
                MYSQL_USERNAME: root
                MYSQL_PASSWORD: ci_test_password
                WORKFLOW_MYSQL_HOST: mysql
                WORKFLOW_MYSQL_PORT: "3306"
                WORKFLOW_MYSQL_DATABASE: techkg_control_ci
                WORKFLOW_MYSQL_USERNAME: root
                WORKFLOW_MYSQL_PASSWORD: ci_test_password
                REDIS_URL: redis://redis:6379/0
                AUTH_ENABLED: "false"
                AUTH_ALLOW_INSECURE_DEV_CONTEXT: "true"
                AUTH_COOKIE_SECURE: "false"
                AUTH_COOKIE_PATH: /
                SCHEMA_AUTO_INIT: "false"
                CORRECTION_SYNC_WORKER_ENABLED: "false"
                PREWARM_BUSINESS: "false"
                LLM_API_KEY: ${LLM_API_KEY}
                ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY}
              depends_on:
                mysql:
                  condition: service_healthy
                redis:
                  condition: service_healthy
          EOF
          docker compose -f compose.ci.yml config --quiet

      - name: Build Docker test image
        run: docker compose -f compose.ci.yml build api

      - name: Deploy FastAPI with test infrastructure
        run: docker compose -f compose.ci.yml up -d

      - name: Wait for FastAPI health
        run: |
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent http://127.0.0.1:8001/health)" && [ "$response" = '{"status":"ok"}' ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f compose.ci.yml logs --no-color
          exit 1

      - name: Run integration tests
        run: docker compose -f compose.ci.yml exec -T api env PYTHONPATH=. .venv/bin/pytest tests/integration -m "not external" -v

      - name: Print logs on failure
        if: failure()
        run: docker compose -f compose.ci.yml logs --no-color

      - name: Tear down temporary infrastructure
        if: always()
        run: docker compose -f compose.ci.yml down -v
