services:
  api:
    build: .
    container_name: tech-kg-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SCHEMA_AUTO_INIT: ${SCHEMA_AUTO_INIT:-true}
      SCHEMA_S3_ENDPOINT_URL: ${SCHEMA_S3_ENDPOINT_URL:-http://schema-minio:9000}
      SCHEMA_S3_ACCESS_KEY: ${SCHEMA_S3_ACCESS_KEY:-minioadmin}
      SCHEMA_S3_SECRET_KEY: ${SCHEMA_S3_SECRET_KEY:-minioadmin}
      SCHEMA_S3_BUCKET: ${SCHEMA_S3_BUCKET:-tech-kg-schema-scripts}
      SCHEMA_S3_REGION: ${SCHEMA_S3_REGION:-us-east-1}
      SCHEMA_S3_SECURE: ${SCHEMA_S3_SECURE:-false}
      SCHEMA_SCRIPT_MAX_BYTES: ${SCHEMA_SCRIPT_MAX_BYTES:-10485760}
      SCHEMA_ADMIN_USER_IDS: ${SCHEMA_ADMIN_USER_IDS:-schema-admin}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gkx_element}
      TRS_GRAPH_BASE_URL: ${TRS_GRAPH_BASE_URL:-http://trs-graph-service:8090}
      TRS_GRAPH_SPACE: ${TRS_GRAPH_SPACE:-dev}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      WORKFLOW_RETRY_INTERVAL_SECONDS: ${WORKFLOW_RETRY_INTERVAL_SECONDS:-30}
    networks:
      - app
      - engine
      - graph
    volumes:
      - .:/app
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      schema-minio:
        condition: service_healthy
    restart: unless-stopped

  schema-minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tech-kg-schema-minio-dev
    environment:
      MINIO_ROOT_USER: ${SCHEMA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SCHEMA_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - schema-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app
    restart: unless-stopped

volumes:
  schema-minio-data:

networks:
  app:
  engine:
    external: true
    name: tech-kg-engine_default
  graph:
    external: true
    name: trs-graph-service_default
