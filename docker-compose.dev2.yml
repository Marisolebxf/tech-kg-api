# Dev2 测试栈：仅起 api / web / temporal-worker，复用生产已运行的共享服务
# (mysql / trs-graph-service / milvus / redis / temporal / operator-rustfs / m3e-embedding)。
#
# 与 docker-compose.yml 的差异：
# - 服务名 -dev2 后缀（避免与生产 `api`/`web`/`temporal-worker` 在 tech-kg-api_app
#   网络上的 DNS alias 冲突）；
# - 容器名 -dev2 后缀，端口 8002/8089，避免与生产 8001/8088 冲突；
# - TRS_GRAPH_SPACE 显式锁死 dev2（不读 ${TRS_GRAPH_SPACE}，避免根 .env 改回 dev 时静默切换）；
# - 其余 env 完全复用 docker-compose.yml 的 environment 块（${VAR:-default} 从根 .env 插值）；
# - 通过 external 网络 tech-kg-api_app 访问共享服务；
# - 独立卷 workflow-state-dev2 / operator-data-dev2 / patent-index-state-dev2，
#   不污染生产的 SQLite 控制面 / operator 存储 / 专利索引状态；
# - web 通过 volume 覆盖 nginx 配置，upstream 指向 api-dev2（见 frontend/nginx.dev2.conf）。
#
# 启动：docker compose -f docker-compose.dev2.yml up -d --build

services:
  api-dev2:
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: tech-kg-api-dev2-api:latest
    container_name: tech-kg-api-dev2
    ports:
      - "8002:8000"
    env_file:
      - ./backend/.env
    environment:
      # === 与 docker-compose.yml api.environment 基本一致；差异：TRS_GRAPH_SPACE 锁死 dev2，
      # 且 MySQL/trs-graph 默认走 host.docker.internal（dev2 不在生产 engine/trs-graph 网络上，
      # 容器名 mysql/trs-graph-service 在本栈解析不到；宿主机已发布 3306/8090 端口）===
      TRS_GRAPH_BASE_URL: ${TRS_GRAPH_BASE_URL:-http://host.docker.internal:8090}
      TRS_GRAPH_SPACE: dev2
      TRS_GRAPH_API_KEY: ${TRS_GRAPH_API_KEY:-ysukeg}
      TRS_GRAPH_TIMEOUT: ${TRS_GRAPH_TIMEOUT:-30}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gkx_element}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      PAPER_COOP_MYSQL_HOST: ${PAPER_COOP_MYSQL_HOST:-${MYSQL_HOST:-host.docker.internal}}
      PAPER_COOP_MYSQL_PORT: ${PAPER_COOP_MYSQL_PORT:-${MYSQL_PORT:-3306}}
      PAPER_COOP_MYSQL_DATABASE: ${PAPER_COOP_MYSQL_DATABASE:-gkx_local}
      PAPER_COOP_MYSQL_USERNAME: ${PAPER_COOP_MYSQL_USERNAME:-${MYSQL_USERNAME:-root}}
      PAPER_COOP_MYSQL_PASSWORD: ${PAPER_COOP_MYSQL_PASSWORD:-${MYSQL_PASSWORD:-123456789}}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_URI: ${MILVUS_URI:-}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      PATENT_MILVUS_COLLECTION: ${PATENT_MILVUS_COLLECTION:-patent}
      PATENT_INDEX_STATE_DIR: ${PATENT_INDEX_STATE_DIR:-/app/var/patent_indexes}
      PATENT_INDEX_PAGE_SIZE: ${PATENT_INDEX_PAGE_SIZE:-1000}
      PATENT_BM25_DIM: ${PATENT_BM25_DIM:-262144}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-glm-4.7-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      TEMPORAL_ADDRESS: temporal-dev2:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: tech-kg-workflows
      # 控制面 MySQL（temporal-mysql-dev2 的 techkg_control 库，跟 Temporal 共用实例但独立库）
      WORKFLOW_MYSQL_HOST: temporal-mysql-dev2
      WORKFLOW_MYSQL_PORT: "3306"
      WORKFLOW_MYSQL_DATABASE: techkg_control
      WORKFLOW_MYSQL_USERNAME: root
      WORKFLOW_MYSQL_PASSWORD: temporal
      WORKFLOW_SCRIPT_DIR: /var/lib/tech-kg/scripts
      WORKFLOW_DEMO_DATA_ENABLED: ${WORKFLOW_DEMO_DATA_ENABLED:-false}
      # 开发期关闭网关签名校验，未传 X-User-Id 时返回 dev-anonymous 身份。
      # 生产保持 REVIEW_IDENTITY_REQUIRE_SIGNATURE=true 且配 REVIEW_IDENTITY_HMAC_SECRET。
      REVIEW_IDENTITY_REQUIRE_SIGNATURE: "false"
      PLATFORM_INITIAL_ADMIN_USER_IDS: ${PLATFORM_INITIAL_ADMIN_USER_IDS:-}
      PLATFORM_BOOTSTRAP_FIRST_ADMIN: ${PLATFORM_BOOTSTRAP_FIRST_ADMIN:-true}
      CORRECTION_SYNC_WORKER_ENABLED: ${CORRECTION_SYNC_WORKER_ENABLED:-true}
      CORRECTION_SYNC_INTERVAL_SECONDS: ${CORRECTION_SYNC_INTERVAL_SECONDS:-30}
      CORRECTION_SYNC_MAX_ATTEMPTS: ${CORRECTION_SYNC_MAX_ATTEMPTS:-8}
      CORRECTION_SYNC_MODE: ${CORRECTION_SYNC_MODE:-dual}
      # 单存储节点集群：3 副本建空间会 Host not enough
      GRAPH_SPACE_REPLICA_FACTOR: ${GRAPH_SPACE_REPLICA_FACTOR:-1}
      SCHEMA_AUTO_INIT: ${SCHEMA_AUTO_INIT:-false}
      SCHEMA_ALLOW_SYSTEM_DELETE: ${SCHEMA_ALLOW_SYSTEM_DELETE:-true}
      # 与主 compose 一致：schema 脚本走共享的 operator-rustfs
      SCHEMA_S3_ENDPOINT_URL: ${SCHEMA_S3_ENDPOINT_URL:-http://operator-rustfs:9000}
      SCHEMA_S3_ACCESS_KEY: ${SCHEMA_S3_ACCESS_KEY:-rustfsadmin}
      SCHEMA_S3_SECRET_KEY: ${SCHEMA_S3_SECRET_KEY:-rustfsadmin}
      SCHEMA_S3_BUCKET: ${SCHEMA_S3_BUCKET:-tech-kg-schema-scripts}
      SCHEMA_S3_REGION: ${SCHEMA_S3_REGION:-us-east-1}
      SCHEMA_S3_SECURE: ${SCHEMA_S3_SECURE:-false}
      SCHEMA_SCRIPT_MAX_BYTES: ${SCHEMA_SCRIPT_MAX_BYTES:-10485760}
      SCHEMA_ADMIN_USER_IDS: ${SCHEMA_ADMIN_USER_IDS:-schema-admin}
      PATENT_EMBEDDING_PROVIDER: ${PATENT_EMBEDDING_PROVIDER:-openai}
      PATENT_EMBEDDING_BASE_URL: ${PATENT_EMBEDDING_BASE_URL:-http://m3e-embedding:8010/v1}
      PATENT_EMBEDDING_MODEL: ${PATENT_EMBEDDING_MODEL:-moka-ai/m3e-small}
      PATENT_EMBEDDING_DIM: ${PATENT_EMBEDDING_DIM:-512}
      PATENT_EMBEDDING_API_KEY: ${PATENT_EMBEDDING_API_KEY:-local-no-auth}
      OPERATOR_DIR: /app/operators/user
      OPERATOR_WORKER_BASE_URIS: ${OPERATOR_WORKER_BASE_URIS:-}
      OPERATOR_RELOAD_TOKEN: ${OPERATOR_RELOAD_TOKEN:-}
      OPERATOR_S3_ENDPOINT_URL: http://operator-rustfs:9000
      OPERATOR_S3_BUCKET: ${OPERATOR_S3_BUCKET:-tech-kg-operators}
      OPERATOR_S3_PREFIX: ${OPERATOR_S3_PREFIX:-operators}
      OPERATOR_S3_ACCESS_KEY_ID: ${OPERATOR_S3_ACCESS_KEY_ID:-rustfsadmin}
      OPERATOR_S3_SECRET_ACCESS_KEY: ${OPERATOR_S3_SECRET_ACCESS_KEY:-rustfsadmin}
      OPERATOR_S3_REGION: ${OPERATOR_S3_REGION:-us-east-1}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_SESSION_BACKEND: redis
      AUTH_SESSION_COOKIE: ${AUTH_SESSION_COOKIE:-techkg_session}
      USER_CENTER_PORTAL_COOKIE_LOGIN_ENABLED: ${USER_CENTER_PORTAL_COOKIE_LOGIN_ENABLED:-false}
      USER_CENTER_PORTAL_TOKEN_COOKIE: ${USER_CENTER_PORTAL_TOKEN_COOKIE:-access_token}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-604800}
      AUTH_STATE_TTL_SECONDS: ${AUTH_STATE_TTL_SECONDS:-300}
      AUTH_AUDIT_TTL_SECONDS: ${AUTH_AUDIT_TTL_SECONDS:-7776000}
      AUTH_AUDIT_MAX_ITEMS: ${AUTH_AUDIT_MAX_ITEMS:-200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/bkg_zpt}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-https://edu.itic-sci.com/bkg_zpt}
      USER_CENTER_SSO_LOGIN_URL: ${USER_CENTER_SSO_LOGIN_URL:-https://edu.itic-sci.com/uc/sso/login}
      USER_CENTER_OAUTH_BASE_URL: ${USER_CENTER_OAUTH_BASE_URL:-https://edu.itic-sci.com/uc/admin-api/system/oauth2}
      USER_CENTER_ACCOUNT_URL: ${USER_CENTER_ACCOUNT_URL:-https://edu.itic-sci.com/uc/admin/login?redirect=/index}
      USER_CENTER_CLIENT_ID: ${USER_CENTER_CLIENT_ID:-}
      USER_CENTER_CLIENT_SECRET: ${USER_CENTER_CLIENT_SECRET:-}
      USER_CENTER_REDIRECT_URI: ${USER_CENTER_REDIRECT_URI:-https://edu.itic-sci.com/bkg_zpt/api/v1/auth/callback}
      USER_CENTER_SCOPE: ${USER_CENTER_SCOPE:-}
      REDIS_URL: ${REDIS_URL:-redis://auth-redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - operator-data-dev2:/app/operators/user
      - patent-index-state-dev2:/app/var/patent_indexes
      - workflow-state-dev2:/var/lib/tech-kg
    networks:
      - app
    depends_on:
      temporal-dev2:
        condition: service_started
    restart: unless-stopped

  temporal-worker-dev2:
    image: tech-kg-api-dev2-api:latest
    container_name: tech-kg-temporal-worker-dev2
    command: [".venv/bin/python", "-m", "script.run_temporal_worker"]
    env_file:
      - ./backend/.env
    environment:
      TRS_GRAPH_BASE_URL: ${TRS_GRAPH_BASE_URL:-http://host.docker.internal:8090}
      TRS_GRAPH_SPACE: dev2
      TRS_GRAPH_API_KEY: ${TRS_GRAPH_API_KEY:-ysukeg}
      TRS_GRAPH_TIMEOUT: ${TRS_GRAPH_TIMEOUT:-30}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gkx_element}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_URI: ${MILVUS_URI:-}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      ORG_MILVUS_STATE_DIR: ${ORG_MILVUS_STATE_DIR:-/var/lib/tech-kg/organization_milvus}
      TEMPORAL_ADDRESS: temporal-dev2:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: tech-kg-workflows
      WORKFLOW_MYSQL_HOST: temporal-mysql-dev2
      WORKFLOW_MYSQL_PORT: "3306"
      WORKFLOW_MYSQL_DATABASE: techkg_control
      WORKFLOW_MYSQL_USERNAME: root
      WORKFLOW_MYSQL_PASSWORD: temporal
      WORKFLOW_SCRIPT_DIR: /var/lib/tech-kg/scripts
      # worker 也跑 build_entity_index activity：embedding 缺省会回退智谱默认端点，
      # 吃 401 重试 5 次才降级（执行拖到 3 分钟），补齐与 api 一致的 m3e 配置
      PATENT_EMBEDDING_PROVIDER: ${PATENT_EMBEDDING_PROVIDER:-openai}
      PATENT_EMBEDDING_BASE_URL: ${PATENT_EMBEDDING_BASE_URL:-http://m3e-embedding:8010/v1}
      PATENT_EMBEDDING_MODEL: ${PATENT_EMBEDDING_MODEL:-moka-ai/m3e-small}
      PATENT_EMBEDDING_DIM: ${PATENT_EMBEDDING_DIM:-512}
      PATENT_EMBEDDING_API_KEY: ${PATENT_EMBEDDING_API_KEY:-local-no-auth}
      SCHEMA_S3_ENDPOINT_URL: ${SCHEMA_S3_ENDPOINT_URL:-http://operator-rustfs:9000}
      SCHEMA_S3_ACCESS_KEY: ${SCHEMA_S3_ACCESS_KEY:-rustfsadmin}
      SCHEMA_S3_SECRET_KEY: ${SCHEMA_S3_SECRET_KEY:-rustfsadmin}
      SCHEMA_S3_BUCKET: ${SCHEMA_S3_BUCKET:-tech-kg-schema-scripts}
      SCHEMA_S3_REGION: ${SCHEMA_S3_REGION:-us-east-1}
      SCHEMA_S3_SECURE: ${SCHEMA_S3_SECURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workflow-state-dev2:/var/lib/tech-kg
    networks:
      - app
    depends_on:
      temporal-dev2:
        condition: service_started
    restart: unless-stopped

  web-dev2:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        # dev2 nginx 挂在根路径（nginx.dev2.conf 无 /bkg_zpt/ 映射），锁死 base=/，
        # 不读根 .env 的 VITE_BASE=/bkg_zpt/（生产门户路径）——否则 vite 产物引用
        # /bkg_zpt/assets/* 而 nginx 404 → 白屏。与 TRS_GRAPH_SPACE 锁死同一理由。
        VITE_BASE: /
        VITE_API_BASE: /api
        VITE_GRAPH_SPACE: ${VITE_GRAPH_SPACE:-dev2}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
        VITE_PORTAL_EMBEDDED_DEFAULT: ${VITE_PORTAL_EMBEDDED_DEFAULT:-false}
        VITE_PORTAL_ALLOWED_ORIGINS: ${VITE_PORTAL_ALLOWED_ORIGINS:-https://edu.itic-sci.com}
        VITE_PORTAL_TARGET_ORIGIN: ${VITE_PORTAL_TARGET_ORIGIN:-https://edu.itic-sci.com}
        VITE_PORTAL_SOURCE: ${VITE_PORTAL_SOURCE:-tech-kg-api}
    image: tech-kg-api-dev2-web:latest
    container_name: tech-kg-web-dev2
    ports:
      - "8089:80"
    volumes:
      # 覆盖镜像内默认 nginx.conf，upstream 指向 api-dev2 而非生产的 api
      - ./frontend/nginx.dev2.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-dev2
    networks:
      - app
    restart: unless-stopped

  # Dev2 专用 Temporal 后端 MySQL（独立实例，不与业务库 tech-kg-mysql 共享）
  temporal-mysql-dev2:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.4
    container_name: tech-kg-temporal-mysql-dev2
    environment:
      MYSQL_ROOT_PASSWORD: temporal
    volumes:
      - temporal-mysql-data-dev2:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-ptemporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Dev2 专用 Temporal server（与生产的 tech-kg-temporal 隔离，服务名 temporal-dev2
  # 避免在 tech-kg-api_app 网络上与生产 DNS alias `temporal` 冲突）
  temporal-dev2:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/temporalio/auto-setup:1.29.2
    container_name: tech-kg-temporal-dev2
    environment:
      DB: mysql8
      DB_PORT: 3306
      # 官方 mysql:8.4 镜像的 MYSQL_USER 不是 superuser，auto-setup 无法 CREATE DATABASE；
      # 改用 root 连（MYSQL_ROOT_PASSWORD=temporal 在 temporal-mysql-dev2 里已设）。
      # dev2 测试环境可接受；生产若要避免 root，需要挂 init.sql 给 temporal 用户授全局权限。
      MYSQL_USER: root
      MYSQL_PWD: temporal
      MYSQL_SEEDS: temporal-mysql-dev2
    depends_on:
      temporal-mysql-dev2:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

volumes:
  workflow-state-dev2:
  operator-data-dev2:
  patent-index-state-dev2:
  temporal-mysql-data-dev2:

networks:
  app:
    external: true
    name: tech-kg-api_app
