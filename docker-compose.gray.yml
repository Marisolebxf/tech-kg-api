# 灰度独立栈：运行「实体入库前消歧（灰区人工复核）」分支的效果验证。
# 与 docker-compose.dev2.yml 的差异：
# - 独立端口：api 8008 / web 8097（根路径直开），容器与服务名 -gray 后缀；
# - 独立 Temporal 任务队列 tech-kg-workflows-gray（避免与 dev2 旧 worker 分抢任务）；
# - 独立控制面库 techkg_control_gray（temporal-mysql-dev2 实例上自动建库建表）；
# - AUTH_ENABLED=false：演示栈免登录（dev-anonymous 身份直过管理端权限）；
# - 复用共享服务：宿主机 MySQL / trs-graph（dev2 图空间）、temporal-dev2、
#   auth-redis、operator-rustfs、m3e-embedding（external 网络 tech-kg-api_app）。
# 注意：人工审核 case 表在共享业务库 gkx_element 中，灰区 case 会同时出现在
# dev2 队列里（老前端不渲染新快照字段，不影响）。
#
# 启动：docker compose -f docker-compose.gray.yml up -d --build
# 停止：docker compose -f docker-compose.gray.yml down

services:
  api-gray:
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: tech-kg-api-gray:latest
    container_name: tech-kg-api-gray
    ports:
      - "8008:8000"
    env_file:
      - ./backend/.env
    environment:
      TRS_GRAPH_BASE_URL: ${TRS_GRAPH_BASE_URL:-http://host.docker.internal:8090}
      TRS_GRAPH_SPACE: dev2
      TRS_GRAPH_API_KEY: ${TRS_GRAPH_API_KEY:-ysukeg}
      TRS_GRAPH_TIMEOUT: ${TRS_GRAPH_TIMEOUT:-30}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gkx_element}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_URI: ${MILVUS_URI:-}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      PATENT_INDEX_STATE_DIR: /app/var/patent_indexes
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-glm-5.3-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      TEMPORAL_ADDRESS: temporal-dev2:7233
      TEMPORAL_NAMESPACE: default
      # 独立任务队列：本栈 api 触发的工作流只由本栈 worker（新代码）执行
      TEMPORAL_TASK_QUEUE: tech-kg-workflows-gray
      # 独立控制面库（首次启动自动建库建表，与 dev2 的 techkg_control 隔离）
      WORKFLOW_MYSQL_HOST: temporal-mysql-dev2
      WORKFLOW_MYSQL_PORT: "3306"
      WORKFLOW_MYSQL_DATABASE: techkg_control_gray
      WORKFLOW_MYSQL_USERNAME: root
      WORKFLOW_MYSQL_PASSWORD: temporal
      WORKFLOW_DEMO_DATA_ENABLED: "false"
      REVIEW_IDENTITY_REQUIRE_SIGNATURE: "false"
      CORRECTION_SYNC_WORKER_ENABLED: "false"
      GRAPH_SPACE_REPLICA_FACTOR: "1"
      SCHEMA_AUTO_INIT: ${SCHEMA_AUTO_INIT:-false}
      SCHEMA_ALLOW_SYSTEM_DELETE: "true"
      SCHEMA_S3_ENDPOINT_URL: ${SCHEMA_S3_ENDPOINT_URL:-http://operator-rustfs:9000}
      SCHEMA_S3_ACCESS_KEY: ${SCHEMA_S3_ACCESS_KEY:-rustfsadmin}
      SCHEMA_S3_SECRET_KEY: ${SCHEMA_S3_SECRET_KEY:-rustfsadmin}
      SCHEMA_S3_BUCKET: ${SCHEMA_S3_BUCKET:-tech-kg-schema-scripts}
      SCHEMA_S3_REGION: ${SCHEMA_S3_REGION:-us-east-1}
      SCHEMA_S3_SECURE: "false"
      SCHEMA_SCRIPT_MAX_BYTES: ${SCHEMA_SCRIPT_MAX_BYTES:-10485760}
      SCHEMA_ADMIN_USER_IDS: ${SCHEMA_ADMIN_USER_IDS:-schema-admin}
      PATENT_EMBEDDING_PROVIDER: openai
      PATENT_EMBEDDING_BASE_URL: http://m3e-embedding:8010/v1
      PATENT_EMBEDDING_MODEL: moka-ai/m3e-small
      PATENT_EMBEDDING_DIM: "512"
      PATENT_EMBEDDING_API_KEY: local-no-auth
      # 演示栈免登录：require_authenticated_user 返回 dev 身份，管理端直过
      AUTH_ENABLED: "false"
      AUTH_SESSION_BACKEND: redis
      AUTH_SESSION_COOKIE: ${AUTH_SESSION_COOKIE:-techkg_session}
      USER_CENTER_PORTAL_COOKIE_LOGIN_ENABLED: "false"
      REDIS_URL: ${REDIS_URL:-redis://auth-redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - patent-index-state-gray:/app/var/patent_indexes
    networks:
      - app
    restart: unless-stopped

  temporal-worker-gray:
    image: tech-kg-api-gray:latest
    container_name: tech-kg-temporal-worker-gray
    command: [".venv/bin/python", "-m", "script.run_temporal_worker"]
    env_file:
      - ./backend/.env
    environment:
      TRS_GRAPH_BASE_URL: ${TRS_GRAPH_BASE_URL:-http://host.docker.internal:8090}
      TRS_GRAPH_SPACE: dev2
      TRS_GRAPH_API_KEY: ${TRS_GRAPH_API_KEY:-ysukeg}
      TRS_GRAPH_TIMEOUT: ${TRS_GRAPH_TIMEOUT:-30}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gkx_element}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_URI: ${MILVUS_URI:-}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      ORG_MILVUS_STATE_DIR: /var/lib/tech-kg/organization_milvus
      TEMPORAL_ADDRESS: temporal-dev2:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: tech-kg-workflows-gray
      WORKFLOW_MYSQL_HOST: temporal-mysql-dev2
      WORKFLOW_MYSQL_PORT: "3306"
      WORKFLOW_MYSQL_DATABASE: techkg_control_gray
      WORKFLOW_MYSQL_USERNAME: root
      WORKFLOW_MYSQL_PASSWORD: temporal
      PATENT_EMBEDDING_PROVIDER: openai
      PATENT_EMBEDDING_BASE_URL: http://m3e-embedding:8010/v1
      PATENT_EMBEDDING_MODEL: moka-ai/m3e-small
      PATENT_EMBEDDING_DIM: "512"
      PATENT_EMBEDDING_API_KEY: local-no-auth
      SCHEMA_S3_ENDPOINT_URL: ${SCHEMA_S3_ENDPOINT_URL:-http://operator-rustfs:9000}
      SCHEMA_S3_ACCESS_KEY: ${SCHEMA_S3_ACCESS_KEY:-rustfsadmin}
      SCHEMA_S3_SECRET_KEY: ${SCHEMA_S3_SECRET_KEY:-rustfsadmin}
      SCHEMA_S3_BUCKET: ${SCHEMA_S3_BUCKET:-tech-kg-schema-scripts}
      SCHEMA_S3_REGION: ${SCHEMA_S3_REGION:-us-east-1}
      SCHEMA_S3_SECURE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workflow-state-gray:/var/lib/tech-kg
    networks:
      - app
    restart: unless-stopped

  web-gray:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: tech-kg-api-gray-web:latest
    container_name: tech-kg-web-gray
    ports:
      - "8097:80"
    environment:
      # 空串而非 "/"："/" 经 envsubst 会渲染出 ^~ //api/、^~ // 畸形 location
      APP_BASE: ""
      TRS_GRAPH_SPACE: dev2
      AUTH_ENABLED: "false"
      ADMIN_EXAMPLE_FALLBACK: "false"
    volumes:
      - ./frontend/nginx.gray.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api-gray
    networks:
      - app
    restart: unless-stopped

volumes:
  workflow-state-gray:
  patent-index-state-gray:

networks:
  app:
    external: true
    name: tech-kg-api_app
