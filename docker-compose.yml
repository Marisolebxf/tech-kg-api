services:
  api:
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: tech-kg-api
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      # 默认通过容器网络访问数据服务；部署到远程服务器时可用同名环境变量覆盖。
      TRS_GRAPH_BASE_URL: ${TRS_GRAPH_BASE_URL:-http://trs-graph-service:8090}
      TRS_GRAPH_SPACE: ${TRS_GRAPH_SPACE:-dev}
      TRS_GRAPH_API_KEY: ${TRS_GRAPH_API_KEY:-ysukeg}
      TRS_GRAPH_TIMEOUT: ${TRS_GRAPH_TIMEOUT:-30}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gkx_element}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      # 论文合作库可独立部署；未单独配置时沿用主 MySQL 连接参数。
      PAPER_COOP_MYSQL_HOST: ${PAPER_COOP_MYSQL_HOST:-${MYSQL_HOST:-mysql}}
      PAPER_COOP_MYSQL_PORT: ${PAPER_COOP_MYSQL_PORT:-${MYSQL_PORT:-3306}}
      PAPER_COOP_MYSQL_DATABASE: ${PAPER_COOP_MYSQL_DATABASE:-gkx_local}
      PAPER_COOP_MYSQL_USERNAME: ${PAPER_COOP_MYSQL_USERNAME:-${MYSQL_USERNAME:-root}}
      PAPER_COOP_MYSQL_PASSWORD: ${PAPER_COOP_MYSQL_PASSWORD:-${MYSQL_PASSWORD:-123456789}}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_URI: ${MILVUS_URI:-}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      PATENT_MILVUS_COLLECTION: ${PATENT_MILVUS_COLLECTION:-patent}
      PATENT_INDEX_STATE_DIR: ${PATENT_INDEX_STATE_DIR:-/app/var/patent_indexes}
      PATENT_INDEX_PAGE_SIZE: ${PATENT_INDEX_PAGE_SIZE:-1000}
      PATENT_BM25_DIM: ${PATENT_BM25_DIM:-262144}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-glm-4.7-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: tech-kg-workflows
      # 控制面 MySQL（共享栈容器名带 tech-kg- 前缀；跨 compose project 只有容器名 DNS）
      WORKFLOW_MYSQL_HOST: temporal-mysql
      WORKFLOW_MYSQL_PORT: "3306"
      WORKFLOW_MYSQL_DATABASE: techkg_control
      WORKFLOW_MYSQL_USERNAME: root
      WORKFLOW_MYSQL_PASSWORD: temporal
      WORKFLOW_SCRIPT_DIR: /var/lib/tech-kg/scripts
      WORKFLOW_DEMO_DATA_ENABLED: ${WORKFLOW_DEMO_DATA_ENABLED:-false}
      PLATFORM_INITIAL_ADMIN_USER_IDS: ${PLATFORM_INITIAL_ADMIN_USER_IDS:-}
      PLATFORM_BOOTSTRAP_FIRST_ADMIN: ${PLATFORM_BOOTSTRAP_FIRST_ADMIN:-true}
      CORRECTION_SYNC_WORKER_ENABLED: ${CORRECTION_SYNC_WORKER_ENABLED:-true}
      CORRECTION_SYNC_INTERVAL_SECONDS: ${CORRECTION_SYNC_INTERVAL_SECONDS:-30}
      CORRECTION_SYNC_MAX_ATTEMPTS: ${CORRECTION_SYNC_MAX_ATTEMPTS:-8}
      CORRECTION_SYNC_MODE: ${CORRECTION_SYNC_MODE:-projection}
      SCHEMA_AUTO_INIT: ${SCHEMA_AUTO_INIT:-true}
      # schema 脚本 / operator 包 / milvus 内部存储共用 operator-rustfs 一个 S3。
      SCHEMA_S3_ENDPOINT_URL: ${SCHEMA_S3_ENDPOINT_URL:-http://operator-rustfs:9000}
      SCHEMA_S3_ACCESS_KEY: ${SCHEMA_S3_ACCESS_KEY:-rustfsadmin}
      SCHEMA_S3_SECRET_KEY: ${SCHEMA_S3_SECRET_KEY:-rustfsadmin}
      SCHEMA_S3_BUCKET: ${SCHEMA_S3_BUCKET:-tech-kg-schema-scripts}
      SCHEMA_S3_REGION: ${SCHEMA_S3_REGION:-us-east-1}
      SCHEMA_S3_SECURE: ${SCHEMA_S3_SECURE:-false}
      SCHEMA_SCRIPT_MAX_BYTES: ${SCHEMA_SCRIPT_MAX_BYTES:-10485760}
      SCHEMA_ADMIN_USER_IDS: ${SCHEMA_ADMIN_USER_IDS:-schema-admin}
      PATENT_EMBEDDING_PROVIDER: ${PATENT_EMBEDDING_PROVIDER:-openai}
      PATENT_EMBEDDING_BASE_URL: ${PATENT_EMBEDDING_BASE_URL:-http://m3e-embedding:8010/v1}
      PATENT_EMBEDDING_MODEL: ${PATENT_EMBEDDING_MODEL:-moka-ai/m3e-small}
      PATENT_EMBEDDING_DIM: ${PATENT_EMBEDDING_DIM:-512}
      PATENT_EMBEDDING_API_KEY: ${PATENT_EMBEDDING_API_KEY:-local-no-auth}
      OPERATOR_DIR: /app/operators/user
      OPERATOR_WORKER_BASE_URIS: ${OPERATOR_WORKER_BASE_URIS:-}
      OPERATOR_RELOAD_TOKEN: ${OPERATOR_RELOAD_TOKEN:-}
      OPERATOR_S3_ENDPOINT_URL: http://operator-rustfs:9000
      OPERATOR_S3_BUCKET: ${OPERATOR_S3_BUCKET:-tech-kg-operators}
      OPERATOR_S3_PREFIX: ${OPERATOR_S3_PREFIX:-operators}
      OPERATOR_S3_ACCESS_KEY_ID: ${OPERATOR_S3_ACCESS_KEY_ID:-rustfsadmin}
      OPERATOR_S3_SECRET_ACCESS_KEY: ${OPERATOR_S3_SECRET_ACCESS_KEY:-rustfsadmin}
      OPERATOR_S3_REGION: ${OPERATOR_S3_REGION:-us-east-1}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_SESSION_BACKEND: redis
      AUTH_SESSION_COOKIE: ${AUTH_SESSION_COOKIE:-techkg_session}
      # 统一门户部署默认复用主域 access_token；无该 Cookie 时仍回退标准 OAuth2 登录。
      USER_CENTER_PORTAL_COOKIE_LOGIN_ENABLED: ${USER_CENTER_PORTAL_COOKIE_LOGIN_ENABLED:-true}
      USER_CENTER_PORTAL_TOKEN_COOKIE: ${USER_CENTER_PORTAL_TOKEN_COOKIE:-access_token}
      # 连续 30 分钟无已认证请求后，本地会话失效。
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-1800}
      AUTH_STATE_TTL_SECONDS: ${AUTH_STATE_TTL_SECONDS:-300}
      AUTH_AUDIT_TTL_SECONDS: ${AUTH_AUDIT_TTL_SECONDS:-7776000}
      AUTH_AUDIT_MAX_ITEMS: ${AUTH_AUDIT_MAX_ITEMS:-200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/bkg_zp}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-https://edu.itic-sci.com/bkg_zp}
      USER_CENTER_SSO_LOGIN_URL: ${USER_CENTER_SSO_LOGIN_URL:-https://edu.itic-sci.com/uc/sso/login}
      USER_CENTER_OAUTH_BASE_URL: ${USER_CENTER_OAUTH_BASE_URL:-https://edu.itic-sci.com/uc/admin-api/system/oauth2}
      USER_CENTER_ACCOUNT_URL: ${USER_CENTER_ACCOUNT_URL:-https://edu.itic-sci.com/uc/admin/login?redirect=/index}
      USER_CENTER_CLIENT_ID: ${USER_CENTER_CLIENT_ID:-}
      USER_CENTER_CLIENT_SECRET: ${USER_CENTER_CLIENT_SECRET:-}
      USER_CENTER_REDIRECT_URI: ${USER_CENTER_REDIRECT_URI:-https://edu.itic-sci.com/bkg_zp/api/v1/auth/callback}
      USER_CENTER_SCOPE: ${USER_CENTER_SCOPE:-}
      REDIS_URL: ${REDIS_URL:-redis://auth-redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - operator-data:/app/operators/user
      - patent-index-state:/app/var/patent_indexes
      - workflow-state:/var/lib/tech-kg
    depends_on:
      operator-rustfs:
        condition: service_healthy
      m3e-embedding:
        # api 启动不依赖 m3e（仅专利 embedding 接口运行时 HTTP 调用），
        # 改 service_started 避免全新环境等 m3e 下载模型超 healthcheck 导致 api 起不来。
        condition: service_started
      auth-redis:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - app
      - engine
      - graph
      - shared-infra
      - business-mysql
    restart: unless-stopped

  m3e-embedding:
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: tech-kg-api-m3e-embedding
    command:
      [
        ".venv/bin/uvicorn",
        "script.m3e_embedding_service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8010",
      ]
    ports:
      - "127.0.0.1:8011:8010"
    environment:
      M3E_MODEL_NAME: moka-ai/m3e-small
      M3E_EMBEDDING_DIM: 512
      M3E_DEVICE: cpu
      M3E_BATCH_SIZE: 8
      M3E_MAX_BATCH_SIZE: 64
      M3E_MAX_CONCURRENCY: 1
      HF_HOME: /models/huggingface
    volumes:
      - m3e-model-cache:/models/huggingface
    networks:
      - app
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  temporal-mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.4
    container_name: tech-kg-temporal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: temporal
    volumes:
      - temporal-mysql-data:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-ptemporal",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/temporalio/auto-setup:1.29.2
    container_name: tech-kg-temporal
    ports:
      - "7233:7233"
    environment:
      DB: mysql8
      DB_PORT: 3306
      # 官方 mysql:8.4 镜像的 MYSQL_USER 不是 superuser，auto-setup 无法 CREATE DATABASE；
      # 改用 root 连（MYSQL_ROOT_PASSWORD=temporal 在 temporal-mysql 里已设）。
      MYSQL_USER: root
      MYSQL_PWD: temporal
      MYSQL_SEEDS: temporal-mysql
    depends_on:
      temporal-mysql:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  temporal-ui:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/temporalio/ui:2.39.0
    container_name: tech-kg-temporal-ui
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    networks:
      - app
    restart: unless-stopped

  temporal-worker:
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: tech-kg-temporal-worker
    command: [".venv/bin/python", "-m", "script.run_temporal_worker"]
    env_file:
      - ./backend/.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: tech-kg-workflows
      WORKFLOW_MYSQL_HOST: temporal-mysql
      WORKFLOW_MYSQL_PORT: "3306"
      WORKFLOW_MYSQL_DATABASE: techkg_control
      WORKFLOW_MYSQL_USERNAME: root
      WORKFLOW_MYSQL_PASSWORD: temporal
      TEMPORAL_MAX_CONCURRENT_ACTIVITIES: ${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:-4}
      WORKFLOW_SCRIPT_DIR: /var/lib/tech-kg/scripts
      TRS_GRAPH_BASE_URL: ${TRS_GRAPH_BASE_URL:-http://trs-graph-service:8090}
      TRS_GRAPH_SPACE: ${TRS_GRAPH_SPACE:-dev}
      TRS_GRAPH_API_KEY: ${TRS_GRAPH_API_KEY:-ysukeg}
      TRS_GRAPH_TIMEOUT: ${TRS_GRAPH_TIMEOUT:-30}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gkx_element}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_URI: ${MILVUS_URI:-}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      ORG_MILVUS_STATE_DIR: ${ORG_MILVUS_STATE_DIR:-/var/lib/tech-kg/organization_milvus}
    volumes:
      - workflow-state:/var/lib/tech-kg
    depends_on:
      - temporal

  auth-redis:
    image: redis:7.4-alpine
    container_name: tech-kg-auth-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - auth-redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_BASE: ${VITE_BASE:-/bkg_zpt/}
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_GRAPH_SPACE: ${VITE_GRAPH_SPACE:-dev2}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
    container_name: tech-kg-web
    ports:
      - "8088:80"
    depends_on:
      - api
    networks:
      - app
    restart: unless-stopped

  operator-rustfs-volume-init:
    image: alpine:3.22
    container_name: tech-kg-operator-rustfs-volume-init
    volumes:
      - operator-rustfs-data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    restart: "no"

  operator-rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: tech-kg-operator-rustfs
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "9020:9000"
      - "9021:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${OPERATOR_S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${OPERATOR_S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - operator-rustfs-data:/data
    depends_on:
      operator-rustfs-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: tech-kg-api-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - app
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: tech-kg-api-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19531:19530"
      - "9093:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      # Milvus 的对象存储也走 operator-rustfs（S3 兼容），bucket 用默认的 a-bucket，
      # 启动时自动创建；凭证复用 OPERATOR_S3_*。
      MINIO_ADDRESS: operator-rustfs:9000
      MINIO_ACCESS_KEY_ID: ${OPERATOR_S3_ACCESS_KEY_ID:-rustfsadmin}
      MINIO_SECRET_ACCESS_KEY: ${OPERATOR_S3_SECRET_ACCESS_KEY:-rustfsadmin}
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_started
      operator-rustfs:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

volumes:
  milvus-etcd-data:
  milvus-data:
  temporal-mysql-data:
  workflow-state:
  m3e-model-cache:
  patent-index-state:
  operator-data:
  operator-rustfs-data:
  auth-redis-data:

networks:
  app:
  # 共享 infra 栈（operator-rustfs / temporal 等）所在网络——跨 compose project
  # 只有容器名 DNS，且需与该网络互通才能解析
  shared-infra:
    external: true
    name: tech-kg-api_app
  # 业务库 tech-kg-mysql（gkx_element）所在网络，别名 mysql
  business-mysql:
    external: true
    name: gkx-mysql_default
  engine:
    external: true
    name: tech-kg-engine_default
  graph:
    external: true
    name: trs-graph-service_default
