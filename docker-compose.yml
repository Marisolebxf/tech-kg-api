services:
  api:
    build: ./backend
    container_name: tech-kg-api
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      # API直接加入数据服务所在的Docker网络，通过容器DNS访问，不绕宿主机端口。
      MYSQL_HOST: mysql
      TRS_GRAPH_BASE_URL: http://trs-graph-service:8090
      TRS_GRAPH_SPACE: dev
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
    networks:
      - app
      - engine
      - graph
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: tech-kg-web
    ports:
      - "8088:80"
    depends_on:
      - api
    networks:
      - app
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: tech-kg-api-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: tech-kg-api-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9011:9001"
      - "9010:9000"
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: tech-kg-api-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19531:19530"
      - "9093:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    restart: unless-stopped

volumes:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:

networks:
  app:
  engine:
    external: true
    name: tech-kg-engine_default
  graph:
    external: true
    name: trs-graph-service_default
