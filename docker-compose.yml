services:
  api:
    build: ./backend
    container_name: tech-kg-api
    ports:
      - "8001:8000"
    environment:
      TRS_GRAPH_BASE_URL: ${TRS_GRAPH_BASE_URL:-http://host.docker.internal:8090}
      TRS_GRAPH_SPACE: ${TRS_GRAPH_SPACE:-techkg}
      TRS_GRAPH_API_KEY: ${TRS_GRAPH_API_KEY:-ysukeg}
      TRS_GRAPH_TIMEOUT: ${TRS_GRAPH_TIMEOUT:-30}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techkg}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      PAPER_COOP_MYSQL_DATABASE: ${PAPER_COOP_MYSQL_DATABASE:-gkx_local}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-glm-4.7-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      SCHEMA_AUTO_INIT: ${SCHEMA_AUTO_INIT:-true}
      SCHEMA_S3_ENDPOINT_URL: ${SCHEMA_S3_ENDPOINT_URL:-http://schema-minio:9000}
      SCHEMA_S3_ACCESS_KEY: ${SCHEMA_S3_ACCESS_KEY:-minioadmin}
      SCHEMA_S3_SECRET_KEY: ${SCHEMA_S3_SECRET_KEY:-minioadmin}
      SCHEMA_S3_BUCKET: ${SCHEMA_S3_BUCKET:-tech-kg-schema-scripts}
      SCHEMA_S3_REGION: ${SCHEMA_S3_REGION:-us-east-1}
      SCHEMA_S3_SECURE: ${SCHEMA_S3_SECURE:-false}
      SCHEMA_SCRIPT_MAX_BYTES: ${SCHEMA_SCRIPT_MAX_BYTES:-10485760}
      SCHEMA_ADMIN_USER_IDS: ${SCHEMA_ADMIN_USER_IDS:-schema-admin}
    depends_on:
      schema-minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  schema-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tech-kg-schema-minio
    environment:
      MINIO_ROOT_USER: ${SCHEMA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SCHEMA_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - schema-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: tech-kg-web
    ports:
      - "8088:80"
    depends_on:
      - api
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: tech-kg-api-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: tech-kg-api-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9011:9001"
      - "9010:9000"
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: tech-kg-api-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19531:19530"
      - "9093:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    restart: unless-stopped

volumes:
  schema-minio-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
