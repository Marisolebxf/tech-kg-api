services:
  api:
    build: ./backend
    container_name: tech-kg-api
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      # API直接加入数据服务所在的Docker网络，通过容器DNS访问，不绕宿主机端口。
      MYSQL_HOST: mysql
      MYSQL_DATABASE: gkx_element
      TRS_GRAPH_BASE_URL: http://trs-graph-service:8090
      TRS_GRAPH_SPACE: dev
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      PATENT_EMBEDDING_PROVIDER: openai
      PATENT_EMBEDDING_BASE_URL: http://m3e-embedding:8010/v1
      PATENT_EMBEDDING_MODEL: moka-ai/m3e-small
      PATENT_EMBEDDING_DIM: 512
      PATENT_EMBEDDING_API_KEY: local-no-auth
    volumes:
      - patent-index-state:/app/var/patent_indexes
    depends_on:
      m3e-embedding:
        condition: service_healthy
    networks:
      - app
      - engine
      - graph
    restart: unless-stopped

  m3e-embedding:
    build: ./backend
    container_name: tech-kg-api-m3e-embedding
    command: [".venv/bin/uvicorn", "script.m3e_embedding_service:app", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "127.0.0.1:8011:8010"
    environment:
      M3E_MODEL_NAME: moka-ai/m3e-small
      M3E_EMBEDDING_DIM: 512
      M3E_DEVICE: cpu
      M3E_BATCH_SIZE: 8
      M3E_MAX_BATCH_SIZE: 64
      M3E_MAX_CONCURRENCY: 1
      HF_HOME: /models/huggingface
    volumes:
      - m3e-model-cache:/models/huggingface
    networks:
      - app
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: tech-kg-web
    ports:
      - "8088:80"
    depends_on:
      - api
    networks:
      - app
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: tech-kg-api-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: tech-kg-api-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9011:9001"
      - "9010:9000"
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: tech-kg-api-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19531:19530"
      - "9093:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    restart: unless-stopped

volumes:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  m3e-model-cache:
  patent-index-state:

networks:
  app:
  engine:
    external: true
    name: tech-kg-engine_default
  graph:
    external: true
    name: trs-graph-service_default
