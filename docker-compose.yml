services:
  api:
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: tech-kg-api
    ports:
      - "8001:8000"
    environment:
      # 容器内的 localhost 指向 API 容器自身，宿主机服务统一走 host gateway。
      TRS_GRAPH_BASE_URL: ${CONTAINER_TRS_GRAPH_BASE_URL:-http://host.docker.internal:8090}
      TRS_GRAPH_SPACE: ${TRS_GRAPH_SPACE:-techkg}
      TRS_GRAPH_API_KEY: ${TRS_GRAPH_API_KEY:-ysukeg}
      TRS_GRAPH_TIMEOUT: ${TRS_GRAPH_TIMEOUT:-30}
      MYSQL_HOST: ${CONTAINER_MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techkg}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      PAPER_COOP_MYSQL_HOST: ${CONTAINER_MYSQL_HOST:-host.docker.internal}
      PAPER_COOP_MYSQL_PORT: ${MYSQL_PORT:-3306}
      PAPER_COOP_MYSQL_DATABASE: ${PAPER_COOP_MYSQL_DATABASE:-gkx_local}
      PAPER_COOP_MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      PAPER_COOP_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-glm-4.7-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: tech-kg-workflows
      WORKFLOW_DATABASE_PATH: /var/lib/tech-kg/workflows.db
      WORKFLOW_SCRIPT_DIR: /var/lib/tech-kg/scripts
    volumes:
      - workflow-state:/var/lib/tech-kg
    depends_on:
      - temporal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  temporal-postgresql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/postgres:16-alpine
    container_name: tech-kg-temporal-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgresql-data:/var/lib/postgresql/data
    restart: unless-stopped

  temporal:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/temporalio/auto-setup:1.29.2
    container_name: tech-kg-temporal
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    depends_on:
      - temporal-postgresql
    restart: unless-stopped

  temporal-ui:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/temporalio/ui:2.39.0
    container_name: tech-kg-temporal-ui
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    restart: unless-stopped

  temporal-worker:
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: tech-kg-temporal-worker
    command: [".venv/bin/python", "-m", "script.run_temporal_worker"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: tech-kg-workflows
      WORKFLOW_DATABASE_PATH: /var/lib/tech-kg/workflows.db
      WORKFLOW_SCRIPT_DIR: /var/lib/tech-kg/scripts
    volumes:
      - workflow-state:/var/lib/tech-kg
    depends_on:
      - temporal
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: tech-kg-web
    ports:
      - "8088:80"
    depends_on:
      - api
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: tech-kg-api-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: tech-kg-api-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9011:9001"
      - "9010:9000"
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: tech-kg-api-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19531:19530"
      - "9093:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    restart: unless-stopped

volumes:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  temporal-postgresql-data:
  workflow-state:
