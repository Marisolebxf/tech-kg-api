# 业务与中间件持久化存储。
# 说明：若在容器管理平台界面创建 PVC（推荐），可跳过本文件，
# 但 PVC 名称必须与下方一致，否则挂载失败。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: operator-rustfs-data
  namespace: bkg
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-etcd-data
  namespace: bkg
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
