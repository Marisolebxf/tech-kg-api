# operator-rustfs：S3 兼容对象存储。
# schema 脚本 / operator 包 / milvus 内部存储三类数据共用这一个实例。
# 凭证在 tech-kg-secrets 与 rustfs-secrets 中各有一份，修改时两处必须同步。
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-secrets
  namespace: bkg
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: "rustfsadmin"
  RUSTFS_SECRET_KEY: "rustfsadmin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-rustfs
  namespace: bkg
  labels:
    app: operator-rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator-rustfs
  template:
    metadata:
      labels:
        app: operator-rustfs
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        # 修复 NFS 等共享存储的目录属主，保证 rustfs(uid 10001) 可写
        - name: fix-permissions
          image: 10.50.62.9:30303/library/busybox:1.36
          command: ["sh", "-c", "chown -R 10001:10001 /data"]
          volumeMounts:
            - name: rustfs-data
              mountPath: /data
      containers:
        - name: rustfs
          image: 10.50.62.9:30303/library/rustfs:1.0.0-alpha.93
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: s3-api
            - containerPort: 9001
              name: console
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: "0.0.0.0:9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: RUSTFS_SECRET_KEY
            - name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: rustfs-data
              mountPath: /data
      volumes:
        - name: rustfs-data
          persistentVolumeClaim:
            claimName: operator-rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: operator-rustfs
  namespace: bkg
  labels:
    app: operator-rustfs
spec:
  selector:
    app: operator-rustfs
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
