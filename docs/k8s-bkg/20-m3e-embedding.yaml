# m3e-embedding：专利向量化推理服务（后端镜像 backend 换启动命令）。
# v0.0.2 起模型已内置镜像（构建期预置 moka-ai/m3e-small 到 /models/huggingface），
# 启动即用、无需联网下载；HF_HUB_OFFLINE=1 强制离线加载，禁止运行时碰 HF。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m3e-embedding
  namespace: bkg
  labels:
    app: m3e-embedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m3e-embedding
  template:
    metadata:
      labels:
        app: m3e-embedding
    spec:
      imagePullSecrets:
        - name: bkg-image-pull-secret-0
      containers:
        - name: m3e-embedding
          image: 10.50.62.9:30303/bkg/backend:v0.0.2
          imagePullPolicy: IfNotPresent
          command:
            [
              ".venv/bin/uvicorn",
              "script.m3e_embedding_service:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8010",
            ]
          env:
            - name: M3E_MODEL_NAME
              value: "moka-ai/m3e-small"
            - name: M3E_EMBEDDING_DIM
              value: "512"
            - name: M3E_DEVICE
              value: "cpu"
            - name: M3E_BATCH_SIZE
              value: "8"
            - name: M3E_MAX_BATCH_SIZE
              value: "64"
            - name: M3E_MAX_CONCURRENCY
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - containerPort: 8010
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8010
            periodSeconds: 5
            failureThreshold: 24 # 最长 2 分钟，本地加载模型绰绰有余
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: m3e-embedding
  namespace: bkg
  labels:
    app: m3e-embedding
spec:
  selector:
    app: m3e-embedding
  ports:
    - name: http
      port: 8010
      targetPort: 8010
