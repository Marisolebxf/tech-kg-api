# m3e-embedding：专利向量化推理服务。
# 镜像 bkg/m3e-backend 在 backend 镜像基础上烘焙了 moka-ai/m3e-small 模型
# （构建期经 hf-mirror.com 下载，见 backend/Dockerfile.m3e），
# 运行期 HF_HUB_OFFLINE=1 纯离线启动，不依赖集群外网，也不需要模型缓存 PVC。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m3e-embedding
  namespace: bkg
  labels:
    app: m3e-embedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m3e-embedding
  template:
    metadata:
      labels:
        app: m3e-embedding
    spec:
      imagePullSecrets:
        - name: bkg-image-pull-secret-0
      containers:
        - name: m3e-embedding
          image: 10.50.62.9:30303/bkg/m3e-backend:v0.0.1
          imagePullPolicy: IfNotPresent
          command:
            [
              ".venv/bin/uvicorn",
              "script.m3e_embedding_service:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8010",
            ]
          env:
            - name: M3E_MODEL_NAME
              value: "moka-ai/m3e-small"
            - name: M3E_EMBEDDING_DIM
              value: "512"
            - name: M3E_DEVICE
              value: "cpu"
            - name: M3E_BATCH_SIZE
              value: "8"
            - name: M3E_MAX_BATCH_SIZE
              value: "64"
            - name: M3E_MAX_CONCURRENCY
              value: "1"
            - name: HF_HOME
              value: /opt/models/huggingface
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - containerPort: 8010
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8010
            periodSeconds: 10
            failureThreshold: 18 # 模型已烘焙进镜像，启动 1-2 分钟
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: m3e-embedding
  namespace: bkg
  labels:
    app: m3e-embedding
spec:
  selector:
    app: m3e-embedding
  ports:
    - name: http
      port: 8010
      targetPort: 8010
