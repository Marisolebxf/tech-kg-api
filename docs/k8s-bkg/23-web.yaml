# web：前端静态资源 + /api/ 反代（独立前端镜像）。
# 部署前缀等配置运行时注入：envFrom 同一份 bkg-config（APP_BASE 等），
# 镜像一次构建、多环境部署（见 docs/前端一次构建多环境部署方案.md）。
# 入口为剥前缀转发（§八 Ingress rewrite-target /$2）：挂载根路径全兜底模板
# nginx.k8s.conf 覆盖镜像内置前缀模板——容器收到根路径，前缀只存在于
# 浏览器侧（runtime-config.js 注入 base=/bkg_zpt、apiBase=/bkg_zpt/api）。
# 若入口改为不剥前缀的直连子路径，删除下方 volumes/volumeMounts 即可。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bkg
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: bkg-image-pull-secret-0
      containers:
        - name: web
          image: 10.50.62.9:30303/bkg/web:v0.0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bkg-config
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # 根路径模板（剥前缀入口用）；必须挂到 templates/ 供 20-envsubst 渲染
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
      volumes:
        - name: nginx-template
          configMap:
            name: bkg-nginx-template
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bkg
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30880
