# web：前端静态资源 + /api/ 反代（独立前端镜像）。
# 镜像内 nginx 反代 http://api:8000，与 api Service 同命名空间直连。
# 部署前缀等配置运行时注入：envFrom 同一份 bkg-config（APP_BASE 等），
# 镜像一次构建、多环境部署（见 docs/前端一次构建多环境部署方案.md）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bkg
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: bkg-image-pull-secret-0
      containers:
        - name: web
          image: 10.50.62.9:30303/bkg/web:v0.0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bkg-config
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bkg
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30880
