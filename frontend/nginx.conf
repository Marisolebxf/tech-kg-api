server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

  # 门户基座下的 API 调用（VITE_API_BASE 相对 base 时会带 /bkg_zpt 前缀）：
  # 去前缀代理到后端，否则落到 SPA fallback 返回 HTML
  location ^~ /bkg_zpt/api/ {
    rewrite ^/bkg_zpt/api/(.*)$ /api/$1 break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 门户基座 /bkg_zpt/（VITE_BASE）：入口重定向 + SPA 资产/路由回退
  location = / {
    return 302 /bkg_zpt/;
  }

  # Vite base=/bkg_zpt/ 的产物引用 /bkg_zpt/assets/...——alias 去前缀映射到根
  # dist；SPA 路由回退到根 index.html（其引用的资产再经此 location 兜住）
  location ^~ /bkg_zpt/ {
    # 仅允许同源页面和国科信统一门户嵌入，禁止任意第三方站点 framing。
    add_header Content-Security-Policy "frame-ancestors 'self' https://edu.itic-sci.com" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /index.html;
  }

  location = /bkg_zpt {
    return 302 /bkg_zpt/;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
