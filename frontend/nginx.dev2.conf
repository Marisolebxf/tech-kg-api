server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

  # docker 内置 DNS（127.0.0.11），让 nginx 在运行时解析 api-dev2，
  # 配合 proxy_pass 变量语法，避免 api-dev2 容器重启换 IP 后 nginx 仍连旧 IP 导致 502
  resolver 127.0.0.11 valid=10s ipv6=off;

  # dev2 测试栈：upstream 指向 dev2 api 服务名 api-dev2（同名 alias 在 tech-kg-api_app
  # 网络上由 dev2 容器提供，避免与生产 `api` alias 冲突）
  location ^~ /api/ {
    set $upstream_api http://api-dev2:8000;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
