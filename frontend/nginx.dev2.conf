# dev2 前端 nginx 配置（模板，无 ${APP_BASE} location）。
# 门户 edu.itic-sci.com 会把 /bkg_zpt 前缀【剥掉】后转发到本栈——浏览器侧
# 带前缀（由 runtime-config.js 注入 base=/bkg_zpt、apiBase=/bkg_zpt/api，
# 资产引用经哨兵替换为 /bkg_zpt/assets），到达本 nginx 时已是根路径，
# 因此这里只需根路径全兜底：
#   /bkg_zpt/overview      → 门户转发 /overview      → location / SPA 回退
#   /bkg_zpt/assets/x.js   → 门户转发 /assets/x.js   → 静态文件
#   /bkg_zpt/api/v1/...    → 门户转发 /api/v1/...    → 下方 /api/ 代理
# 8089（web-dev2，门户入口）APP_BASE=/bkg_zpt；8091（web-dev2-root，e2e/本地）
# APP_BASE=""——两者仅 runtime-config.js 内容不同，nginx 行为一致。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

  # docker 内置 DNS（127.0.0.11），让 nginx 在运行时解析 api-dev2，
  # 配合 proxy_pass 变量语法，避免 api-dev2 容器重启换 IP 后 nginx 仍连旧 IP 导致 502
  resolver 127.0.0.11 valid=10s ipv6=off;

  location ^~ /api/ {
    set $upstream_api http://api-dev2:8000;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    # 门户 iframe 嵌入仅允许同源与统一门户，禁止第三方 framing
    add_header Content-Security-Policy "frame-ancestors 'self' https://edu.itic-sci.com" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SPA index.html 必须 no-cache，否则浏览器用 stale HTML（含旧 JS hash 引用）
    # 即使后端 rebuild 前端看到的还是老 bundle，router 走老逻辑可能跳 overview
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
