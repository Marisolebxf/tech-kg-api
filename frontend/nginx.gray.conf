# 灰度独立栈前端 nginx 配置（根路径实例，配套 docker-compose.gray.yml）。
# 与 nginx.dev2.conf 仅一处差异：upstream 指向本栈的 api-gray。
# 独立演示/灰度验证用——端口 8097，APP_BASE=""（根路径直开）。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

  # docker 内置 DNS（127.0.0.11），让 nginx 在运行时解析 api-gray，
  # 配合 proxy_pass 变量语法，避免 api-gray 容器重启换 IP 后 nginx 仍连旧 IP 导致 502
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header Content-Security-Policy "frame-ancestors 'self' https://edu.itic-sci.com" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ^~ /api/ {
    set $upstream_api http://api-gray:8000;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://edu.itic-sci.com" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ /index.html;
  }

  # Revalidate the entry document so it references the current hashed assets.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header Content-Security-Policy "frame-ancestors 'self' https://edu.itic-sci.com" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }
}
