# 在 sandbox/compose.dev2.yml 之后追加，仅用于显式启用 dev2 真实认证。
services:
  api-dev2:
    environment:
      AUTH_ENABLED: "true"
      TRS_GRAPH_SPACE: ${DEV2_SHARED_GRAPH_SPACE:?Set the verified existing shared graph space}
  temporal-worker-dev2:
    environment:
      AUTH_ENABLED: "true"
      TRS_GRAPH_SPACE: ${DEV2_SHARED_GRAPH_SPACE:?Set the verified existing shared graph space}
  web-dev2:
    environment:
      AUTH_ENABLED: "true"
      TRS_GRAPH_SPACE: ${DEV2_SHARED_GRAPH_SPACE:?Set the verified existing shared graph space}
  web-dev2-root:
    environment:
      AUTH_ENABLED: "true"
      TRS_GRAPH_SPACE: ${DEV2_SHARED_GRAPH_SPACE:?Set the verified existing shared graph space}
