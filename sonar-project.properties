sonar.projectKey=tech-kg-api-scan
sonar.projectName=tech-kg-api
sonar.sources=backend,frontend/src
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Unit and integration tests are executed separately and are not production code.
sonar.exclusions=backend/tests/**,frontend/src/**/__tests__/**,frontend/src/**/*.spec.ts,frontend/src/**/*.test.ts,**/.venv/**,**/node_modules/**,**/dist/**,**/__pycache__/**,**/.pytest_cache/**,**/.tmp/**,**/*.pyc,**/*.sqlite*,**/*.db,**/*.log,**/*.xlsx,**/*.png,backend/coverage.xml,frontend/coverage/**,backend/static/swagger/**

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=backend/script/**,backend/organization_ETL/**,backend/operators/**,backend/tests/**,frontend/src/**/__tests__/**,frontend/src/**/*.spec.ts,frontend/src/**/*.test.ts
